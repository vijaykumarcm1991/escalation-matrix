<!DOCTYPE html>
<html>
<head>
    <title>Escalations</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="headerBar">
    <div class="header-left">
        <div class="header-logo">
            <img src="/static/onmobile-logo1.png" class="logo-img" alt="OnMobile Logo">
            <h2>Escalation Matrix</h2>
        </div>
    </div>

    <div class="header-right">
        <span id="loggedInUser"></span>
        <button id="loginBtn" class="btn secondary" onclick="goToAdminLogin()">Admin Login</button>
        <button id="auditBtn" class="btn secondary" onclick="goToAudit()">Audit Logs</button>
        <button id="dashboardBtn" class="btn secondary" style="display:none;" onclick="goToDashboard()">Dashboard</button>
        <button id="bulkImportBtn" class="btn secondary" style="display:none;">Bulk Import</button>
        <button id="logoutBtn" class="btn danger" onclick="logout()">Logout</button>
        <button id="createBtn" class="btn primary" onclick="goToCreate()">Create Escalation</button>
    </div>
</div>

<div class="container">
    <div class="card">
        <h3>Escalation Configurations</h3>
        
        <div class="jsm-search-box">
            <input
                type="text"
                id="jsmTicket"
                placeholder="Enter JSM Ticket ID (IND-1234)"
            >

            <button class="btn primary" onclick="searchJSMTicket()">
                Find Escalation
            </button>
            <div id="incidentContext" class="incident-context hidden"></div>
            <button class="btn secondary" onclick="resetJSM()">Reset</button>
            <button id="matrixToggleBtn" class="btn secondary" onclick="toggleMatrixView()">
            Matrix View
            </button>
        </div>
        
        <button class="btn secondary advanced-toggle" onclick="toggleAdvancedFilters()">
        Advanced Filters ▼
        </button>
        <div id="advancedFilters" class="filter-bar">
            
            <input type="text" id="searchInput" class="smart-search" placeholder="Smart Search: ticket, unit, location, group, application..." onkeyup="applyFilters()">

            <select id="unitFilter" onchange="applyFilters()">
                <option value="">All Units</option>
            </select>

            <select id="geoFilter" onchange="applyFilters()">
                <option value="">All Geographies</option>
            </select>

            <select id="infraFilter" onchange="applyFilters()">
                <option value="">All Infra Apps</option>
            </select>

            <select id="appFilter" onchange="applyFilters()">
                <option value="">All Applications</option>
            </select>

            <select id="userFilter" onchange="applyUserFilter()">
                <option value="">All Users</option>
            </select>

            <button class="btn secondary" onclick="clearFilters()">Clear</button>

            <button id="exportBtn" class="btn primary" onclick="exportCSV()">Export CSV</button>

        </div>

        <div class="matrix-wrapper">
        <table id="escalationsTable" class="modern-table">
            <thead>
                <tr>
                    <th onclick="sortTable('unit')">Unit</th>
                    <th onclick="sortTable('geography')">Geography</th>
                    <th onclick="sortTable('infra_app')">Infra App</th>
                    <th onclick="sortTable('application')">Application</th>
                    <th onclick="sortTable('affected_ci')">Affected CI</th>
                    <th onclick="sortTable('location')">Location</th>
                    <th>Group ID</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        </div>

        <div class="pagination-bar">
            <div id="resultInfo"></div>

            <div class="pagination-controls">
                <label>
                    Rows:
                    <select id="rowsPerPage" onchange="changeRowsPerPage()">
                        <option value="5">5</option>
                        <option value="10" selected>10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                    </select>
                </label>

                <button class="btn secondary" onclick="prevPage()">Prev</button>
                <span id="pageNumbers"></span>
                <button class="btn secondary" onclick="nextPage()">Next</button>
            </div>
        </div>

    </div>
</div>

<div id="toastContainer"></div>

<script src="/static/main.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {

    setupHeaderVisibility();
    loadEscalations();

    const ticketBox = document.getElementById("jsmTicket");

    if (ticketBox) {

        ticketBox.addEventListener("keypress", function (e) {

            if (e.key === "Enter") {
                searchJSMTicket();
            }

        });

    }

});
</script>

</body>
</html>
