<!DOCTYPE html>
<html>
<head>
    <title>Create Escalation</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-body">

<div id="toastContainer"></div>

<div class="page-container">
    <div class="card">

        <div class="page-header">
            <div class="header-logo">
                <img src="/static/onmobile-logo.png" class="logo-img" alt="OnMobile Logo">
                <div>
                    <h2>Create Escalation</h2>
                    <p class="page-subtitle">Define escalation matrix configuration</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn secondary" onclick="goToEscalations()">Back</button>
                <button class="btn danger" onclick="logout()">Logout</button>
            </div>
        </div>

        <!-- Configuration Section -->
        <div class="section">
            <h3>Configuration</h3>

            <div class="grid-2">

                <div class="form-group">
                    <label>Application</label>
                    <select id="application" onchange="checkExistingEscalation()"></select>
                </div>

                <div class="form-group">
                    <label>Geography</label>
                    <select id="geography" onchange="checkExistingEscalation()"></select>
                </div>

                <div class="form-group">
                    <label>Unit</label>
                    <select id="unit" onchange="checkExistingEscalation()"></select>
                </div>

                <div class="form-group">
                    <label>Infra App</label>
                    <select id="infra_app" onchange="checkExistingEscalation()"></select>
                </div>

            </div>

            <div class="form-group full-width">
                <label>Affected CI (Optional)</label>
                <input type="text"
                       id="affected_ci"
                       placeholder="ivrtel01.dhk.bl.ombd/10.231.1.206"
                       onchange="checkExistingEscalation()">
            </div>
            <div class="form-group full-width">
                <label>Location (Optional)</label>
                <input type="text"
                       id="location"
                       placeholder="Bangalore / Mumbai / DC1"
                       onchange="checkExistingEscalation()">
            </div>
        </div>

        <!-- Levels Section -->
        <div class="section">
            <h3>Escalation Levels</h3>

            <div id="levelsContainer"></div>

            <button class="btn secondary small" onclick="addLevel()">
                + Add Level
            </button>
        </div>

        <!-- Action -->
        <div class="action-bar">
            <button id="submitButton"
                    class="btn primary"
                    onclick="submitEscalation()"
                    data-mode="create">
                Create Escalation
            </button>
        </div>

    </div>
</div>

<script src="/static/main.js"></script>
<script>
    initializeCreatePage();
</script>

</body>
</html>
